<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- TV stand base -->
  <rect x="36" y="108" width="56" height="10" rx="5" fill="#333333"/>
  <!-- Stand neck -->
  <rect x="56" y="96" width="16" height="16" rx="4" fill="#444444"/>
  <!-- TV frame -->
  <rect x="8" y="18" width="112" height="82" rx="10" fill="#1A1A2A"/>
  <!-- Screen (big, bright) -->
  <rect x="16" y="26" width="96" height="66" rx="6" fill="#1A4A9A"/>
  <!-- Screen content - simple colorful image suggestion -->
  <rect x="16" y="26" width="96" height="66" rx="6" fill="#2060CC" opacity="0.60"/>
  <!-- Screen shine -->
  <ellipse cx="42" cy="42" rx="24" ry="14" fill="#FFFFFF" opacity="0.14"/>
  <!-- Power button -->
  <circle cx="114" cy="88" r="5" fill="#22DD44"/>
  <!-- Speaker dots -->
  <circle cx="20" cy="58" r="2" fill="#333"/>
  <circle cx="20" cy="66" r="2" fill="#333"/>
  <circle cx="20" cy="74" r="2" fill="#333"/>
</svg>
