<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Mug body (big, round, clear) -->
  <rect x="16" y="40" width="84" height="78" rx="12" fill="#906040"/>
  <!-- Body highlight -->
  <rect x="20" y="44" width="32" height="70" rx="10" fill="#B07850" opacity="0.45"/>
  <!-- HANDLE (big and obvious - key mug feature) -->
  <path d="M 100 52 Q 124 52 124 80 Q 124 108 100 108 L 96 108 L 96 96 Q 112 96 112 80 Q 112 64 96 64 L 100 52 Z" fill="#7A5030"/>
  <!-- Coffee inside (dark top) -->
  <ellipse cx="58" cy="40" rx="42" ry="10" fill="#4A2808"/>
  <!-- Steam wisps (IMMEDIATELY recognizable = hot mug) -->
  <path d="M 36 26 Q 30 14 36 6" stroke="#CCCCCC" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.80"/>
  <path d="M 58 20 Q 52 8 58 2" stroke="#CCCCCC" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.80"/>
  <path d="M 80 26 Q 74 14 80 6" stroke="#CCCCCC" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.80"/>
  <!-- Base line -->
  <rect x="16" y="110" width="84" height="8" rx="4" fill="#7A5030"/>
</svg>
