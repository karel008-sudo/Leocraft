<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Main pepper body (bell shape) -->
  <path d="M 24 56 Q 22 100 44 116 Q 64 124 84 116 Q 106 100 104 56 Q 90 42 64 40 Q 38 42 24 56 Z" fill="#30A030"/>
  <!-- Three distinct bumps at top (key bell pepper feature) -->
  <circle cx="40" cy="48" r="20" fill="#38B038"/>
  <circle cx="64" cy="40" r="22" fill="#40B840"/>
  <circle cx="88" cy="48" r="20" fill="#38B038"/>
  <!-- Highlight on body -->
  <ellipse cx="44" cy="72" rx="12" ry="22" fill="#58C840" opacity="0.50"/>
  <!-- Stem -->
  <rect x="60" y="18" width="8" height="24" rx="4" fill="#5A3010"/>
  <!-- Calyx -->
  <path d="M 54 36 Q 44 22 38 28" stroke="#2A7020" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 64 32 Q 64 18 64 14" stroke="#2A7020" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 74 36 Q 84 22 90 28" stroke="#2A7020" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Bottom crease lines -->
  <path d="M 44 100 Q 64 106 84 100" stroke="#207020" stroke-width="2" fill="none"/>
</svg>
