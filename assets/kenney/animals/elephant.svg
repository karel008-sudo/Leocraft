  <circle cx="78" cy="48" r="9" fill="white"/>
  <circle cx="52" cy="49" r="5" fill="#222"/>
  <circle cx="80" cy="49" r="5" fill="#222"/>
  <circle cx="53" cy="47" r="2" fill="white"/>
