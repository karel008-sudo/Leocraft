  <!-- Trunk (key feature - prominent, hanging down) -->
  <path d="M 52 74 Q 44 90 46 108 Q 48 116 56 116 Q 64 116 66 108 Q 68 96 60 80" stroke="#8890A8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 52 74 Q 44 90 46 108 Q 48 116 56 116 Q 64 116 66 108 Q 68 96 60 80" stroke="#9BA0B8" stroke-width="10" fill="none" stroke-linecap="round"/>
