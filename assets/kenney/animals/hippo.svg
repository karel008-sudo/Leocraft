<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Massive wide head -->
  <ellipse cx="64" cy="68" rx="56" ry="52" fill="#7E8CB0"/>
  <!-- Head top lighter -->
  <ellipse cx="64" cy="52" rx="48" ry="38" fill="#8E9CC0"/>
  <!-- Small ears on top -->
  <circle cx="20" cy="28" r="14" fill="#7E8CB0"/>
  <circle cx="108" cy="28" r="14" fill="#7E8CB0"/>
  <circle cx="20" cy="28" r="7" fill="#C0A8CC"/>
  <circle cx="108" cy="28" r="7" fill="#C0A8CC"/>
  <!-- Big nostrils on flat snout (key feature) -->
  <ellipse cx="64" cy="82" rx="32" ry="20" fill="#9AAAC0"/>
  <ellipse cx="50" cy="82" rx="10" ry="8" fill="#6878A0"/>
  <ellipse cx="78" cy="82" rx="10" ry="8" fill="#6878A0"/>
  <!-- Eyes (tiny, high on head - hippo characteristic) -->
  <circle cx="40" cy="46" r="9" fill="white"/>
  <circle cx="88" cy="46" r="9" fill="white"/>
  <circle cx="41" cy="47" r="5.5" fill="#333"/>
  <circle cx="89" cy="47" r="5.5" fill="#333"/>
  <circle cx="42" cy="45" r="2" fill="white"/>
  <circle cx="90" cy="45" r="2" fill="white"/>
  <!-- Huge smile / mouth line -->
  <path d="M 24 76 Q 64 68 104 76" stroke="#6878A0" stroke-width="3" fill="none"/>
  <!-- Big teeth visible -->
  <rect x="50" y="96" width="12" height="10" rx="3" fill="#FFFCE0"/>
  <rect x="66" y="96" width="12" height="10" rx="3" fill="#FFFCE0"/>
</svg>
